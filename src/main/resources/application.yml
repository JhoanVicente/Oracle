server:
  port: 8085

spring:
  application:
    name: backend
  datasource:
    url: jdbc:oracle:thin:@developer_medium?TNS_ADMIN=Wallet_developer
    username: DEVELOPER
    password: 12345
    driver-class-name: oracle.jdbc.OracleDriver
    #url: jdbc:oracle:thin:@localhost:1521:xe
    #username: DEVELOPER
    #password: Admin12345
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
  main:
    allow-bean-definition-overriding: true
  sql:
    init:
      mode: always  # Ejecuta schema.sql y data.sql en cada inicio
  springdoc:
    api-docs:
      enabled: true
      path: /api-docs
    swagger-ui:
      enabled: true
      path: /swagger-ui.html
